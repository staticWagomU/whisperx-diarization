[project]
name = "whisperx-diarization"
version = "0.1.0"
description = "High-accuracy speaker-diarized transcription with whispermlx (Japanese-focused)"
readme = "README.md"
# torch / pyannote.audio などの macOS arm64 wheel が揃う範囲に固定。
requires-python = ">=3.11,<3.13"
dependencies = [
  "whispermlx>=3.13,<4",
]

[tool.uv]
# ASR は whispermlx / mlx-whisper が Apple Silicon GPU で実行する。
# VAD / alignment / diarization の PyTorch 系処理は通常の PyPI wheel でよい。
